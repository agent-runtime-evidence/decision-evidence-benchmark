[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-evidence-benchmark"
version = "0.1.0"
requires-python = ">=3.11,<4"
description = "Benchmark backend scaffold for decision-evidence sufficiency evaluation"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Oleg Solozobov"}]
keywords = [
  "decision evidence",
  "DEMM",
  "agent runtime",
  "benchmark",
  "governance evidence"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6,<7"
]

[project.scripts]
decision-evidence-benchmark = "decision_evidence_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
